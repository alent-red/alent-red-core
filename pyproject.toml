[project]
name = "alent-red-core"
dynamic = ["version"]
description = "ALENT.RED Core"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.78.0,<2.0.0",
    "grpcio-reflection>=1.78.0,<2.0.0",
    "structlog>=25.5.0,<26.0.0",
    "sqlmodel>=0.0.33,<0.0.34",
    "aiosqlite>=0.22.1,<0.23.0",
    "greenlet>=3.3.1,<4.0.0",
    "anthropic>=0.79.0,<0.80.0",
    "openai>=2.21.0,<3.0.0",
    "cryptography>=46.0.5,<47.0.0",
    "pillow>=12.2.0,<13.0.0",
    "httpx>=0.28.1,<0.29.0",
    "certifi>=2025.0.0,<2027.0.0",
    "pyyaml>=6.0.3,<7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/alent_red_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/alent_red_core"]

[dependency-groups]
dev = [
    "grpcio-tools>=1.78.0,<2.0.0",
    "black>=26.1.0,<27.0.0",
    "mypy>=1.19.1,<2.0.0",
    "types-grpcio>=1.0.0.20251009,<2.0.0.0",
    "types-grpcio-reflection>=1.0.0.20250506,<2.0.0.0",
    "types-protobuf>=6.32.1.20251210,<7.0.0.0",
    "debugpy>=1.8.20,<2.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "types-pyyaml>=6.0.12.20260510,<7.0.0.0",
    "nuitka>=4.1.1,<5.0.0",
    "ordered-set>=4.1.0,<5.0.0",
    "zstandard>=0.25.0,<0.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # Exclude generated code
  src/alent_red_core/generated
)/
'''

[tool.mypy]
python_version = "3.10"
strict = true
disallow_any_explicit = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "alent_red_core.generated.*"
ignore_errors = true

# SQLModel/Pydantic framework limitation - Field() type stubs don't cover SQLAlchemy parameters
[[tool.mypy.overrides]]
module = [
    "alent_red_core.models.*",
    "alent_red_core.gateways.telegram.models.*",
    "tests.e2e.config",
]
disable_error_code = ["call-overload", "explicit-any"]
